<body>
<header>✦ ANURANON CREATIONS</header>
<main>
<div id="login" class="card">

</div>

<button onclick="page('dashboard')">Dashboard</button>

<script>
const KEY='anuranon2026';
let db=JSON.parse(localStorage.getItem(KEY)||'{}');

function save(){localStorage.setItem(KEY,JSON.stringify(db))}
function login(){
if(document.getElementById('pin').value===db.pin){
document.getElementById('login').style.display='none';
document.getElementById('app').style.display='block';

}else alert('Incorrect PIN');
}function page(p){

let month=now.getMonth(),year=now.getFullYear();
let monthly=db.payments.filter(x=>{
let d=new Date(x[2]);
return !isNaN(d)&&d.getMonth()===month&&d.getFullYear()===year;
}).reduce((s,x)=>s+Number(x[1]||0),0);

if(p==='dashboard'){
let upcoming=db.bookings.filter(x=>{
let d=new Date(x[3]);
return !isNaN(d)&&d>=new Date(now.toDateString());
}).sort((a,b)=>new Date(a[3])-new Date(b[3])).slice(0,5);

<div class="card">
<h2>Business Dashboard</h2>
<p>Total Clients: ${db.clients.length}</p>
<p>Total Bookings: ${db.bookings.length}</p>
<p>Booking Value: ₹${totalBookings}</p>
<p>Payments Received: ₹${totalPaid}</p>
<p>Pending Payments: ₹${Math.max(0,totalBookings-totalPaid)}</p>
<p>This Month's Income: ₹${monthly}</p>
</div>
<div class="card"><h2>Upcoming Weddings</h2>
${upcoming.map(x=>`<div class="item"><b>${x[0]} & ${x[1]}</b><br>Venue: ${x[2]}<br>Date: ${x[3]}<br>Package: ₹${x[4]}<br>Advance: ₹${x[5]}<br>Remaining Balance: ₹${Math.max(0,Number(x[4]||0)-Number(x[5]||0)-db.payments.filter(pay=>Number(pay[3])===db.bookings.indexOf(x)).reduce((s,pay)=>s+Number(pay[1]||0),0))}<br>Status: ${x[6]}</div>`).join('')||'No upcoming bookings yet.'}

return;
}

if(p==='settings'){

<input id="newpin" placeholder="Enter new PIN">

<button onclick="backup()">Download Backup</button>

<button type="submit">Save Record</button>
</form></div>
<div class="card"><h2>Saved Records</h2><div id="list"></div></div>`;


document.getElementById('recordForm').onsubmit=function(e){

let a=names.map((n,i)=>document.getElementById('v'+i).value);

if(idx!==undefined){

};

w.downloadDigitalInvoice = function(){
  const element = w.document.body;
  const buttons = element.querySelectorAll('button');

  buttons.forEach(button => button.style.display = 'none');

  w.html2pdf().set({
    html2canvas: {
      scale: 2,
      useCORS: true,
      backgroundColor: '#11100e',
      windowWidth: 850
    }
  }).from(element).toCanvas().get('canvas').then(canvas => {

    const pdf = new w.jspdf.jsPDF({
      orientation: 'portrait',
      unit: 'mm',
      format: 'a4'
    });

    const pageWidth = 210;
    const pageHeight = 297;

    const ratio = Math.min(
      pageWidth / canvas.width,
      pageHeight / canvas.height
    );

    const imgWidth = canvas.width * ratio;
    const imgHeight = canvas.height * ratio;

    const x = (pageWidth - imgWidth) / 2;
    const y = (pageHeight - imgHeight) / 2;

    const image = canvas.toDataURL('image/jpeg', 0.98);

    pdf.addImage(image, 'JPEG', x, y, imgWidth, imgHeight);
    pdf.save('Anuranon-Creations-Invoice.pdf');

  }).then(() => {
    buttons.forEach(button => button.style.display = '');
  }).catch(error => {
    buttons.forEach(button => button.style.display = '');
    alert('PDF Error: ' + error.message);
    console.error(error);
  });
};

w.document.close();
}

function edit(p,i){
let a=db[p][i];
page(p);
a.forEach((v,j)=>{
document.getElementById('v'+j).value=v;
});
let f=document.getElementById('recordForm');
f.dataset.editIndex=i;
f.querySelector('button[type="submit"]').textContent='Update Record';
}
function del(p,i){
if(confirm('Delete this record?')){
db[p].splice(i,1);
save();
page(p);
}
}function changePin(){
let p=document.getElementById('newpin').value;
if(p.length<4){
alert('PIN must be at least 4 characters');
return;
}
db.pin=p;
save();
alert('PIN changed successfully');
}

function backup(){
let file=new Blob([JSON.stringify(db,null,2)],{type:'application/json'});
let link=document.createElement('a');
link.href=URL.createObjectURL(file);
link.download='Anuranon-Business-Backup.json';
link.click();
URL.revokeObjectURL(link.href);
}
