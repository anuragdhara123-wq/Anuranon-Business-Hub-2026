<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Anuranon Business Hub 2026</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#101827;color:#fff;font-family:Arial}
header{background:#202e46;padding:20px;font-size:22px;font-weight:bold}
main{padding:15px;max-width:900px;margin:auto}
.card{background:#202e46;padding:18px;margin:12px 0;border-radius:12px}
button{background:#d9ad63;border:0;padding:12px;margin:5px;border-radius:7px;font-weight:bold}
input,select{display:block;width:100%;padding:12px;margin:10px 0;border-radius:6px}
nav{display:flex;flex-wrap:wrap}
h2{color:#e8c17d}
small{color:#bbc7d8}
.item{padding:12px;border-bottom:1px solid #526078}
</style>
<link rel="manifest" href="manifest.json">
</head>
<body>
<header>✦ ANURANON CREATIONS</header>
<main>
<div id="login" class="card">
<h2>Welcome Back</h2>
<p>Business Management Hub</p>
<input id="pin" type="password" placeholder="Enter PIN">
<button onclick="login()">LOGIN</button>
<small>Default PIN: 2580</small>
</div>
<div id="app" style="display:none">
<nav>
<button onclick="page('dashboard')">Dashboard</button>
<button onclick="page('clients')">Clients</button>
<button onclick="page('bookings')">Bookings</button>
<button onclick="page('payments')">Payments</button>
<button onclick="page('packages')">Packages</button>
<button onclick="page('team')">Team</button>
<button onclick="page('leads')">Leads</button>
<button onclick="page('finance')">Finance</button>
<button onclick="page('settings')">Settings</button>
</nav>
<div id="content"></div>
</div>
</main>
<script>
const KEY='anuranon2026';
let db=JSON.parse(localStorage.getItem(KEY)||'{}');
['clients','bookings','payments','packages','team','leads','finance'].forEach(k=>{if(!db[k])db[k]=[]});
db.pin=db.pin||'2580';
function save(){localStorage.setItem(KEY,JSON.stringify(db))}
function login(){
if(document.getElementById('pin').value===db.pin){
document.getElementById('login').style.display='none';
document.getElementById('app').style.display='block';
page('dashboard');
}else alert('Incorrect PIN');
}function page(p){
let c=document.getElementById('content');
let totalBookings=db.bookings.reduce((s,x)=>s+Number(x[4]||0),0);
let totalPaid=db.payments.reduce((s,x)=>s+Number(x[1]||0),0);
let now=new Date();
let month=now.getMonth(),year=now.getFullYear();
let monthly=db.payments.filter(x=>{
let d=new Date(x[2]);
return !isNaN(d)&&d.getMonth()===month&&d.getFullYear()===year;
}).reduce((s,x)=>s+Number(x[1]||0),0);

if(p==='dashboard'){
let upcoming=db.bookings.filter(x=>{
let d=new Date(x[3]);
return !isNaN(d)&&d>=new Date(now.toDateString());
}).sort((a,b)=>new Date(a[3])-new Date(b[3])).slice(0,5);
c.innerHTML=`
<div class="card">
<h2>Business Dashboard</h2>
<p>Total Clients: ${db.clients.length}</p>
<p>Total Bookings: ${db.bookings.length}</p>
<p>Booking Value: ₹${totalBookings}</p>
<p>Payments Received: ₹${totalPaid}</p>
<p>Pending Payments: ₹${Math.max(0,totalBookings-totalPaid)}</p>
<p>This Month's Income: ₹${monthly}</p>
</div>
<div class="card"><h2>Upcoming Weddings</h2>
${upcoming.map(x=>`<div class="item"><b>${x[0]} & ${x[1]}</b><br>Venue: ${x[2]}<br>Date: ${x[3]}<br>Package: ₹${x[4]}<br>Advance: ₹${x[5]}<br>Remaining Balance: ₹${Math.max(0,Number(x[4]||0)-Number(x[5]||0)-db.payments.filter(pay=>Number(pay[3])===db.bookings.indexOf(x)).reduce((s,pay)=>s+Number(pay[1]||0),0))}<br>Status: ${x[6]}</div>`).join('')||'No upcoming bookings yet.'}
</div>`;
return;
}

if(p==='settings'){
c.innerHTML=`<div class="card"><h2>Settings</h2>
<input id="newpin" placeholder="Enter new PIN">
<button onclick="changePin()">Change PIN</button>
<button onclick="backup()">Download Backup</button>
</div>`;
return;
}

let fields={
clients:['Client Name','Phone','Event Date'],
bookings:['Bride Name','Groom Name','Wedding Venue','Wedding Date','Total Package Price','Advance Payment','Booking Status','Linked Client','Select Package'],
payments:['Client Name','Amount Received','Payment Date','Linked Wedding'],
packages:['Package Name','Price','Package Details'],
team:['Member Name','Role','Phone'],
leads:['Lead Name','Phone','Source','Follow-up Status'],
finance:['Description','Amount','Income or Expense','Date']
};
let names=fields[p];
c.innerHTML=`<div class="card"><h2>${p.toUpperCase()}</h2>
<form id="recordForm">
${names.map((n,i)=>p==='bookings'&&i===7?`<select id="v${i}" required><option value="">Select Client</option>${db.clients.map(x=>`<option value="${x[0]}">${x[0]}</option>`).join('')}</select>`:p==='bookings'&&i===8?`<select id="v${i}" required onchange="document.getElementById('v4').value=this.selectedOptions[0].dataset.price"><option value="">Select Package</option>${db.packages.map(x=>`<option value="${x[0]}" data-price="${x[1]}">${x[0]} - ₹${x[1]}</option>`).join('')}</select>`:p==='payments'&&i===3?`<select id="v${i}" required><option value="">Select Wedding</option>${db.bookings.map((x,j)=>`<option value="${j}">${x[0]} & ${x[1]} - ${x[3]}</option>`).join('')}</select>`:`<input id="v${i}" placeholder="${n}" required>`).join('')}
<button type="submit">Save Record</button>
</form></div>
<div class="card"><h2>Saved Records</h2><div id="list"></div></div>`;


document.getElementById('recordForm').onsubmit=function(e){
e.preventDefault();
let a=names.map((n,i)=>document.getElementById('v'+i).value);
let idx=this.dataset.editIndex;

if(idx!==undefined){
db[p][Number(idx)]=a;
}else{
db[p].push(a);
}

if(p==='payments'){
let paymentNo=idx!==undefined?Number(idx)+1:db.payments.length;
let description='Payment #'+paymentNo+' - '+a[0];
let fi=db.finance.findIndex(x=>String(x[0]).startsWith('Payment #'+paymentNo+' - '));
let entry=[description,a[1],'Income',a[2]];
if(fi>=0){
db.finance[fi]=entry;
}else{
db.finance.push(entry);
}
}

save();
page(p);
};



document.getElementById('list').innerHTML=
db[p].map((a,i)=>`<div class="item">${a.join(' | ')}
${p==='bookings'?`<button onclick="invoice(${i})">Generate Invoice</button>`:''}
<button onclick="edit('${p}',${i})">Edit</button>
<button onclick="del('${p}',${i})">Delete</button></div>`).join('')||'No records yet.';
}

function invoice(i){
let b=db.bookings[i];
let client=db.clients.find(x=>x[0]===b[7]);
let payments=db.payments.filter(x=>Number(x[3])===i);
let advance=Number(b[5]||0);
let extra=payments.reduce((s,x)=>s+Number(x[1]||0),0);
let total=Number(b[4]||0);
let paid=advance+extra;
let balance=Math.max(0,total-paid);
let today=new Date().toLocaleDateString('en-IN');
let invoiceNo='ANU-'+new Date().getFullYear()+'-'+String(i+1).padStart(3,'0');

let w=window.open('','_blank');
if(!w){
alert('Please allow pop-ups for this website.');
return;
}

w.document.write(`
<html>
<head>
<title>Anuranon Creations - Invoice</title>
<style>
body{font-family:Georgia,serif;color:#29202a;padding:35px;max-width:850px;margin:auto}
.header{text-align:center;border-bottom:3px double #9b793c;padding-bottom:20px}
h1{color:#98743b;letter-spacing:2px;margin-bottom:5px}
h2{text-align:center;color:#98743b}
.info{display:flex;justify-content:space-between;gap:20px;margin:25px 0}
.box{background:#f8f3e9;padding:15px;border:1px solid #d8c59c;flex:1}
table{width:100%;border-collapse:collapse;margin-top:20px}
td,th{padding:12px;border:1px solid #d8c59c;text-align:left}
th{background:#eee4d0}
.total{font-size:19px;color:#80602b;font-weight:bold}
.footer{text-align:center;margin-top:50px;border-top:2px solid #b49760;padding-top:20px}
button{background:#80602b;color:white;padding:12px 25px;border:0;border-radius:5px;margin-top:25px}
@media print{button{display:none}body{padding:10px}}
</style>
</head>
<body>

<div class="header">
<img src="logo.png" alt="Anuranon Creations Logo" style="width:220px;max-width:100%;height:auto;display:block;margin:0 auto 15px;">
<h2>PAYMENT INVOICE</h2>
</div>


<div class="info">
<div class="box">
<b>Invoice No:</b> ${invoiceNo}<br>
<b>Invoice Date:</b> ${today}
</div>
<div class="box">
<b>Client:</b> ${b[7]}<br>
<b>Phone:</b> ${client?client[1]:'Not available'}
</div>
</div>

<h3>Wedding Details</h3>
<p><b>Bride:</b> ${b[0]}<br>
<b>Groom:</b> ${b[1]}<br>
<b>Venue:</b> ${b[2]}<br>
<b>Wedding Date:</b> ${b[3]}<br>
<b>Package:</b> ${b[8]}</p>

<table>
<tr><th>Description</th><th>Amount</th></tr>
<tr><td>Total Package Price</td><td>₹${total.toLocaleString('en-IN')}</td></tr>
<tr><td>Advance Payment</td><td>₹${advance.toLocaleString('en-IN')}</td></tr>
${payments.map(x=>`<tr><td>Additional Payment (${x[2]})</td><td>₹${Number(x[1]||0).toLocaleString('en-IN')}</td></tr>`).join('')}
<tr><td><b>Total Amount Paid</b></td><td class="total">₹${paid.toLocaleString('en-IN')}</td></tr>
<tr><td><b>Remaining Balance</b></td><td class="total">₹${balance.toLocaleString('en-IN')}</td></tr>
</table>

<div class="footer">
<p>Thank you for choosing Anuranon Creations!</p>
<p>We look forward to capturing your beautiful moments.</p>
<p><b>Authorized Signature</b></p>
</div>
<button onclick="window.print()">Print / Save as PDF</button>
</body>
</html>
`);
w.document.close();
}

function edit(p,i){
let a=db[p][i];
page(p);
a.forEach((v,j)=>{
document.getElementById('v'+j).value=v;
});
let f=document.getElementById('recordForm');
f.dataset.editIndex=i;
f.querySelector('button[type="submit"]').textContent='Update Record';
}
function del(p,i){
if(confirm('Delete this record?')){
db[p].splice(i,1);
save();
page(p);
}
}function changePin(){
let p=document.getElementById('newpin').value;
if(p.length<4){
alert('PIN must be at least 4 characters');
return;
}
db.pin=p;
save();
alert('PIN changed successfully');
}

function backup(){
let file=new Blob([JSON.stringify(db,null,2)],{type:'application/json'});
let link=document.createElement('a');
link.href=URL.createObjectURL(file);
link.download='Anuranon-Business-Backup.json';
link.click();
URL.revokeObjectURL(link.href);
}

save();
</script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js');
  });
}
</script>
</body>
</html>
